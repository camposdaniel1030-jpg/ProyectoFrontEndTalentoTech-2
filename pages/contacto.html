  <main>
    <section class="contacto">
      <div>
        <h1>Contacto</h1>
        <p>Escribinos si tenés alguna consulta.</p>
        <p>hola@alfajoresdaniel.com</p>
      </div>
      <form action="https://formspree.io/f/TU_ID_DE_FORMSPREE" method="POST">
        <label for="nombre">Nombre</label>
        <input type="text" id="nombre" name="nombre" required>
        <label for="email">Correo electrónico</label>
        <input type="email" id="email" name="email" required>
        <label for="mensaje">Mensaje</label>
        <textarea id="mensaje" name="mensaje" rows="5" required></textarea>
        <button class="boton" type="submit">Enviar mensaje</button>
      </form>
    </section>
  </main>
  <footer>
    <div>
      <h3>Alfajores Daniel</h3>
      <p>Tienda de alfajores.</p>
    </div>
    <div>
      <h3>Contacto</h3>
